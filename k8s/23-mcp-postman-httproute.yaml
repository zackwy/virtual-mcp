# Exposes the Postman MCP backend at /mcp/postman, alongside the two .well-known
# discovery documents MCP clients fetch before they can start the OAuth flow.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-postman
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/postman
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp/postman
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp/postman
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-postman
