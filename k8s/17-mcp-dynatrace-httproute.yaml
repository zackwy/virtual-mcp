# Exposes the Dynatrace MCP backend at /mcp/dynatrace, alongside the two
# .well-known discovery documents MCP clients fetch before they can start the
# OAuth flow.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-dynatrace
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/dynatrace
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp/dynatrace
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp/dynatrace
      backendRefs:
        - group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
          name: mcp-dynatrace
