# Exposes the controller's built-in OAuth issuer proxy through the data plane at
# /oauth-issuer. The browser has to reach these paths -- they serve the consent
# screen and both OAuth callbacks (downstream Entra, upstream Atlassian) -- so
# they go through the same gateway address the MCP client uses.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: oauth-issuer-backend
  namespace: agentgateway-system
spec:
  static:
    host: enterprise-agentgateway.agentgateway-system.svc.cluster.local
    port: 7777
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth-issuer
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth-issuer
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: oauth-issuer-backend
