# Exposes the Atlassian MCP backend at /mcp/atlassian, alongside the two
# .well-known discovery documents MCP clients fetch before they can start the
# OAuth flow.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-atlassian
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/atlassian
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp/atlassian
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server/mcp/atlassian
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-atlassian
